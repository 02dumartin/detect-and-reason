seed: 42
ratios:
  train: 0.8
  val: 0.1
  test: 0.1

source:
  voc_root: data/raw/ag-rob-tomato/Dataset-Greenhouse_Tomato_AgRob
  ignore_labels:
    - background

  # 1cls는 숙도 구분 없이 전부 tomato 하나로 병합 (기존 custom_tomato_1cls 등과 동일 컨벤션)
  class_mapping:
    unriped: tomato
    breaking: tomato
    reddish: tomato
    riped: tomato

output:
  yolo_root: data/yolo/ag_rob_tomato_1cls
  coco_root: data/coco/ag_rob_tomato_1cls
  class_names:
    0: tomato
