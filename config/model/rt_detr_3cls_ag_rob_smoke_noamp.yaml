name: rt_detr_3cls_ag_rob_smoke_noamp
family: rt_detr
framework: ultralytics
class_mode: 3cls
mode: detection_only
model:
  init_weight: weights/rtdetr-l.pt
class_names:
  0: fully ripened tomato
  1: half ripened tomato
  2: green tomato
train:
  epochs: 2
  imgsz: 640
  batch: 12
  workers: 8
  run_name: rt_detr_3cls_ag_rob_smoke_noamp
  augmentation:
    mosaic: 0.2
    close_mosaic: 10
    mixup: 0.1
    scale: 0.2
    translate: 0.1
    degrees: 10
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.2
    hsv_v: 0.2
  patience: 30
  amp: false
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
val:
  split: test
  plots: true
  conf: 0.001
  max_det: 300
  iou_default:
    little: 0.45
    default: 0.55
predict:
  save: false
  save_txt: true
  save_conf: true
  conf: 0.25
  max_det: 50
  iou_default:
    little: 0.45
    default: 0.55
metrics:
- mAP50
- mAP50_95
- detection_acc
- classification_acc
- overall_acc
notes:
- AMP(fp16)이 GIoU loss를 작은/저면적 박스에서 불안정하게 만들어 발산을 유발하는지 확인하기 위해 amp만 false로 바꾼 smoke
  config (다른 값은 원본 smoke와 동일)
