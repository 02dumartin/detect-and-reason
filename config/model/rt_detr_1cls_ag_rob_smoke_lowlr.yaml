name: rt_detr_1cls_ag_rob_smoke_lowlr
family: rt_detr
framework: ultralytics
class_mode: 1cls
mode: detection_reasoning
model:
  init_weight: weights/rtdetr-l.pt
class_names:
  0: tomato
train:
  epochs: 2
  imgsz: 640
  batch: 12
  workers: 8
  run_name: rt_detr_1cls_ag_rob_smoke_lowlr
  augmentation:
    mosaic: 0.2
    close_mosaic: 10
    mixup: 0.1
    scale: 0.2
    translate: 0.1
    degrees: 10
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.2
    hsv_v: 0.2
  patience: 30
  amp: true
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.01
  cos_lr: true
val:
  split: test
  plots: true
  conf: 0.001
  max_det: 300
  iou_default:
    little: 0.45
    default: 0.55
predict:
  save: false
  save_txt: true
  save_conf: true
  conf: 0.25
  max_det: 50
  iou_default:
    little: 0.45
    default: 0.55
metrics:
- mAP50
- mAP50_95
- detection_acc
notes:
- RT-DETR가 yolo11/12와 동일한 lr0=0.001을 그대로 써서 발산/저조 성능이 의심되어, rf_detr(lr=1e-4, lr_encoder=1.5e-4)에
  맞춰 lr0을 1e-4로 낮춰 재검증하는 smoke config
