name: rt_detr_1cls_ag_rob_smoke
family: rt_detr
framework: ultralytics
class_mode: 1cls
mode: detection_reasoning
model:
  init_weight: weights/rtdetr-l.pt
class_names:
  0: tomato
train:
  epochs: 2
  imgsz: 640
  batch: 12
  workers: 8
  run_name: rt_detr_1cls_ag_rob_smoke
  augmentation:
    mosaic: 0.2
    close_mosaic: 10
    mixup: 0.1
    scale: 0.2
    translate: 0.1
    degrees: 10
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.2
    hsv_v: 0.2
  patience: 30
  amp: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
val:
  split: test
  plots: true
  conf: 0.001
  max_det: 300
  iou_default:
    little: 0.45
    default: 0.55
predict:
  save: false
  save_txt: true
  save_conf: true
  conf: 0.25
  max_det: 50
  iou_default:
    little: 0.45
    default: 0.55
metrics:
- mAP50
- mAP50_95
- detection_acc
notes:
- ag_rob_tomato smoke test 전용 config (epochs=2). 본 학습은 rt_detr_1cls.yaml(epochs 150)
  사용.
