name: rt_detr_1cls_ag_rob_smoke_noamp_backbonelr
family: rt_detr
framework: ultralytics
class_mode: 1cls
mode: detection_reasoning
model:
  init_weight: weights/rtdetr-l.pt
class_names:
  0: tomato
train:
  epochs: 2
  imgsz: 640
  batch: 12
  workers: 8
  run_name: rt_detr_1cls_ag_rob_smoke_noamp_backbonelr
  augmentation:
    mosaic: 0.2
    close_mosaic: 10
    mixup: 0.1
    scale: 0.2
    translate: 0.1
    degrees: 10
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.2
    hsv_v: 0.2
  patience: 30
  amp: false
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  backbone_lr_factor: 0.1
val:
  split: test
  plots: true
  conf: 0.001
  max_det: 300
  iou_default:
    little: 0.45
    default: 0.55
predict:
  save: false
  save_txt: true
  save_conf: true
  conf: 0.25
  max_det: 50
  iou_default:
    little: 0.45
    default: 0.55
metrics:
- mAP50
- mAP50_95
- detection_acc
notes:
- amp:false에 더해 backbone(HGNetV2)에 lr*0.1을 적용하는 커스텀 트레이너(src/model/rt_detr.py:RTDETRTrainerWithBackboneLR)
  검증용 smoke config
