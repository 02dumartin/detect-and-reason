name: rt_detr_3cls_ag_rob_smoke
family: rt_detr
framework: ultralytics
class_mode: 3cls
mode: detection_only

model:
  init_weight: weights/rtdetr-l.pt

class_names:
  0: fully ripened tomato
  1: half ripened tomato
  2: green tomato

train:
  epochs: 2 # smoke test용 임시값. 정상 학습 확인 후 본 실험은 rt_detr_3cls.yaml(epochs 150)로 진행할 것
  imgsz: 640
  batch: 12
  workers: 8
  run_name: rt_detr_3cls_ag_rob_smoke

  augmentation:
    mosaic: 0.2
    close_mosaic: 10
    mixup: 0.1
    scale: 0.2
    translate: 0.1
    degrees: 10
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.2
    hsv_v: 0.2

  patience: 30
  amp: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true

val:
  split: test
  plots: true
  conf: 0.001
  max_det: 300
  iou_default:
    little: 0.45
    default: 0.55

predict:
  save: false
  save_txt: true
  save_conf: true
  conf: 0.25
  max_det: 50
  iou_default:
    little: 0.45
    default: 0.55

metrics:
  - mAP50
  - mAP50_95
  - detection_acc
  - classification_acc
  - overall_acc

notes:
  - ag_rob_tomato 데이터셋(breaking 라벨 제외, 3cls로 매핑)에 대한 RT-DETR 학습 가능 여부 smoke test 전용 config
  - 정상 확인되면 별도 실험 config로 epochs 150 등 본 학습 설정을 만들 것
