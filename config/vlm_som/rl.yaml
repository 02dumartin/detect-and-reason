model_id: Qwen/Qwen3-VL-4B-Instruct

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  steps: 200
  lr: 5.0e-5
  eval_every: 20
  max_train: 0
  max_eval: 0 # 0 = 전체(val/test split 그대로) -- 데이터셋마다 크기가 달라 고정 상한이 부적절함(2026-09-14)
  oversample_max_factor: 16 # sft_qwen35_27b.yaml과 동일 (som_common.oversample_by_class)
  sft_ce_weight: 0.5 # GRPO-lite loss에 더할 보조 SFT CE 가중치
  temperature: 1.0

  # k(같은 VQA에서 샘플링할 응답 수)는 VRAM에 따라 자동 결정하되 상한만 여기서 지정
  k_by_free_gb:
    - {min_free_gb: 28, k: 4}
    - {min_free_gb: 16, k: 3}
    - {min_free_gb: 0, k: 2}

proposal:
  family: yolo11
  conf: 0.1
  max_boxes: 20

icl:
  n_exemplars: 2
