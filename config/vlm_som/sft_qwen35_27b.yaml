model_id: Qwen/Qwen3.5-27B

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Qwen3.5는 순수 Transformer가 아니라 레이어별로 Qwen3_5Attention(표준,
  # q/k/v/o_proj)과 Qwen3_5GatedDeltaNet(선형 어텐션/SSM, in_proj_qkv/in_proj_z/
  # in_proj_b/in_proj_a/out_proj)이 섞인 하이브리드 아키텍처다(2026-09-14 확인,
  # transformers==5.17.0 modeling_qwen3_5.py). 표준 어텐션 프로젝션만 넣으면
  # GatedDeltaNet 레이어(대부분)는 에러 없이 조용히 LoRA가 안 걸린 채 학습이
  # 진행되므로, 두 계열 프로젝션을 전부 명시한다.
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]

train:
  steps: 400
  lr: 1.0e-4
  eval_every: 20
  max_train: 0 # 0 = 전체
  max_eval: 0 # 0 = 전체(val/test split 그대로) -- 데이터셋마다 크기가 달라 고정 상한이 부적절함(2026-09-14)
  # 희귀 클래스(예: ag_rob_tomato의 fully-ripe, train 348장 중 20장/5.7%에만 존재)가
  # 포함된 이미지를 최대 이 배수까지 반복 삽입해서 한 에폭 안에서 볼 기회를 늘린다.
  # 0이면 비활성화. 클래스 분포가 이미 균형잡힌 데이터셋(little 등)에서는 대부분
  # factor=1이라 사실상 영향이 없다 (som_common.oversample_by_class, 2026-09-14).
  oversample_max_factor: 16

proposal:
  # eval(--proposal-source)이 yolo_world_1cls를 쓰는데 train은 yolo11로 뽑아서
  # 분포가 어긋나던 문제를 고쳤다(2026-09-14) -- train도 실제 Stage-1 detector와
  # 같은 family로 맞춘다. conf=0.1로 낮게 둬서 noisy proposal(dedup/filt 커리큘럼에
  # 필요)은 유지.
  family: yolo_world
  conf: 0.1
  max_boxes: 20

icl:
  n_exemplars: 2

generation:
  # zero-shot(vLLM, config/vlm_som/zeroshot_qwen3_5_27b_vllm.yaml)은 backend가
  # max_new_tokens 인자를 무시하고 이 값을 고정으로 쓴다. 이쪽 hf 경로(sft_som.py)는
  # 마크수 비례 예산(32+8*marks)을 그대로 max_new_tokens로 써서, 상한이 낮으면
  # 마크 많은 이미지에서 JSON이 중간에 잘려 그 이미지 전체 예측이 통째로 날아간다
  # (2026-09-14 확인 -- sft_step400.json에서 실제 생성 토큰 수가 예산과 정확히
  # 일치했다). zero-shot과 같은 예산으로 맞춰서 이 문제를 없앤다.
  max_new_tokens: 768
