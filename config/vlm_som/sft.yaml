model_id: Qwen/Qwen3-VL-4B-Instruct

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  steps: 400
  lr: 1.0e-4
  eval_every: 20
  max_train: 0 # 0 = 전체
  max_eval: 0 # 0 = 전체(val/test split 그대로) -- 데이터셋마다 크기가 달라 고정 상한이 부적절함(2026-09-14)
  oversample_max_factor: 16 # sft_qwen35_27b.yaml과 동일 (som_common.oversample_by_class)

proposal:
  family: yolo11 # 1cls proposal 검출기
  conf: 0.1
  max_boxes: 20

icl:
  n_exemplars: 2
